}

body.light .field select{
background:#e2e7f3;

}

.swap{
display:flex;
justify-content:center;
margin:12px;
}

.swap button{
width:43px;
height:43px;
border-radius:12px;
border:1px solid #8879ff;
background:#8879ff22;
color:#a99dff;
font-size:23px;
cursor:pointer;
}

.result{
font-size:25px;
font-weight:bold;
color:#65d7bb;

}

.convert{
width:100%;
margin-top:22px;
padding:16px;
border:0;
border-radius:12px;
background:linear-gradient(100deg,#8172f4,#637ff5);
color:white;
font-weight:bold;
cursor:pointer;
font-size:15px;
}

.convert:hover{filter:brightness(1.15)}

.summary{
margin-top:18px;
font-size:12px;
color:#9ba7be;
}

.side h3{
font-size:13px;
color:#9c8cff;
margin-bottom:20px;
}

.popular{
display:flex;
justify-content:space-between;
padding:14px 0;
border-bottom:1px solid #ffffff15;
font-size:13px;
}

.popular strong{color:#68d8b8}

.rates{
margin-top:60px;
}

.rates h2{margin-bottom:20px}

.search{
width:100%;
padding:14px;
border:1px solid #ffffff20;
background:#141d32;
color:white;
border-radius:10px;
outline:none;
margin-bottom:18px;
}

body.light .search{
background:white;
color:#17223a;
}

.tablebox{
overflow-x:auto;
background:#141d32;
border-radius:15px;
}

body.light .tablebox{background:white}

table{
width:100%;
border-collapse:collapse;
min-width:550px;
}

th,td{
padding:16px;
text-align:left;
border-bottom:1px solid #ffffff12;
font-size:13px;
}

th{color:#9ba7be;font-size:11px}

.up{color:#5bd7a8}
.down{color:#ff8194}

footer{
text-align:center;
padding:35px;
color:#8995ae;
font-size:12px;
}

@media(max-width:700px){
.layout{grid-template-columns:1fr}
.hero h1{font-size:34px}
header{padding:0 5%}
.card{padding:18px}

const currencies = raw.map(x=>({
code:x[0],name:x[1],rate:x[2],diff:x[3]
}));

function fmt(n){
return Number(n).toLocaleString("en-US",{
maximumFractionDigits:4
});
}

function get(code){
if(code==="UZS"){
return {code:"UZS",name:"O'zbekiston so'mi",rate:1};
}
return currencies.find(c=>c.code===code);
}

function setup(){
let options='<option value="UZS">UZS — So‘m</option>';

options+=currencies.map(c=>
`<option value="${c.code}">${c.code} — ${c.name}</option>`
).join("");

document.getElementById("from").innerHTML=options;
document.getElementById("to").innerHTML=options;

document.getElementById("from").value="USD";
document.getElementById("to").value="UZS";

calculate();
renderPopular();
renderTable();
}

function calculate(){
let amount=Number(document.getElementById("amount").value);
let from=get(document.getElementById("from").value);
let to=get(document.getElementById("to").value);

if(!Number.isFinite(amount)||amount<0){
document.getElementById("result").innerText="—";
return;
}

let answer=amount*from.rate/to.rate;

document.getElementById("result").innerText=fmt(answer);

document.getElementById("summary").innerText=
`1 ${from.code} = ${fmt(from.rate/to.rate)} ${to.code}`;
}

function swap(){
let a=document.getElementById("from");
let b=document.getElementById("to");

let temp=a.value;
a.value=b.value;
b.value=temp;

calculate();
}

function renderPopular(){
let popular=["USD","EUR","RUB","GBP","CNY"];

document.getElementById("popular").innerHTML=
popular.map(code=>{
let c=get(code);

return `
<div class="popular">
<span>${c.code} — ${c.name}</span>
<strong>${fmt(c.rate)} UZS</strong>
</div>
`;
}).join("");
}

function renderTable(){
let search=document.getElementById("search").value.toLowerCase();

let filtered=currencies.filter(c=>
c.code.toLowerCase().includes(search)||
c.name.toLowerCase().includes(search)
);

document.getElementById("table").innerHTML=
filtered.map(c=>`
<tr>
<td>${c.name}</td>
<td><b>${c.code}</b></td>
<td>${fmt(c.rate)} UZS</td>
<td class="${c.diff>=0?'up':'down'}">
${c.diff>0?'+':''}${c.diff}
</td>
</tr>
`).join("");
}

function theme(){
document.body.classList.toggle("light");
}

document.getElementById("amount").addEventListener("input",calculate);
document.getElementById("from").addEventListener("change",calculate);
document.getElementById("to").addEventListener("change",calculate);

setup();
